[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euler1d-fvm"
version = "1.0.0"
description = "Finite-volume methods for the one-dimensional Euler equations, with an exact Riemann solver and a verified order-of-accuracy study."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["cfd", "finite-volume", "euler-equations", "riemann-solver", "shock-tube"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
euler1d = "euler1d.cli:main"

[project.urls]
Repository = "https://github.com/tu-h-nguyn/The-Finite-Volume-Method-for-One-Dimensional-Euler-Equations"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-q --strict-markers --doctest-modules"
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["euler1d"]
omit = ["*/plotting.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
