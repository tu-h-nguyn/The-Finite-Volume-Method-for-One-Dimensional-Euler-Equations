[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euler1d-fvm"
version = "1.0.0"
description = "Finite-volume methods for the one-dimensional Euler equations, with an exact Riemann solver and a verified order-of-accuracy study."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["cfd", "finite-volume", "euler-equations", "riemann-solver", "shock-tube"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8"]
notebook = ["nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.29"]

[project.scripts]
euler1d = "euler1d.cli:main"

[project.urls]
Repository = "https://github.com/tu-h-nguyn/The-Finite-Volume-Method-for-One-Dimensional-Euler-Equations"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the marker so downstream users actually get the type hints.
euler1d = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-q --strict-markers --doctest-modules"
filterwarnings = ["error::RuntimeWarning"]

[tool.mypy]
# Deliberately not pinning python_version: mypy would then refuse the PEP 695
# syntax that recent numpy stubs use, even while running on an interpreter that
# understands it. Minimum-version enforcement is ruff's target-version plus
# requires-python above; mypy runs once, on the newest supported interpreter.
files = ["src/euler1d"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["euler1d"]
# Figure rendering is exercised by scripts/ and the notebook, not by unit tests.
omit = ["*/plotting.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
